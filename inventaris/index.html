<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Inventaris BN2 — Smart Tracker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f8fafc; }
        .glass { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(10px); }
        .safe-bottom { padding-bottom: env(safe-area-inset-bottom); }
        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        .animate-spin-slow { animation: spin 3s linear infinite; }
        .active-tab { background-color: #047857 !important; color: white !important; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-slate-50 text-slate-900">

    <div class="max-w-md mx-auto min-h-screen flex flex-col pb-20">
        <!-- HEADER -->
        <header class="bg-emerald-700 text-white p-6 rounded-b-[2.5rem] shadow-xl relative overflow-hidden">
            <div class="absolute -top-10 -right-10 w-40 h-40 bg-white/10 rounded-full blur-3xl"></div>
            
            <div class="flex justify-between items-start mb-6 relative z-10">
                <div>
                    <div class="flex items-center gap-3 mb-1">
                        <a href="../" class="p-2 bg-white/10 hover:bg-white/20 rounded-xl transition-all" title="Kembali ke Portal">
                            <i data-lucide="home" class="w-5 h-5"></i>
                        </a>
                        <h1 class="text-2xl font-extrabold tracking-tight">Inven BN2</h1>
                        <div id="adminBadge" class="bg-amber-400 text-amber-900 text-[10px] px-2 py-0.5 rounded-full font-black hidden uppercase">ADMIN</div>
                    </div>
                    <p class="text-xs text-emerald-100 opacity-80">Inventaris Barang Perumahan</p>
                </div>
                <div class="flex gap-2">
                    <button id="adminBtn" class="p-2 bg-white/10 hover:bg-white/20 rounded-xl transition-all" title="Admin Login">
                        <i data-lucide="lock" class="w-5 h-5"></i>
                    </button>
                    <button id="refreshBtn" class="p-2 bg-white/10 hover:bg-white/20 rounded-xl transition-all" title="Refresh Data">
                        <i data-lucide="rotate-cw" class="w-5 h-5"></i>
                    </button>
                </div>
            </div>

            <!-- STATS CARD -->
            <div class="bg-white/10 backdrop-blur-md rounded-2xl p-5 border border-white/10 relative z-10">
                <p class="text-[10px] font-bold uppercase tracking-widest text-emerald-200 mb-1">Total Barang Inventaris</p>
                <div class="flex items-baseline gap-3 mb-4">
                    <h2 id="statTotalBarang" class="text-4xl font-black">0</h2>
                    <span class="text-sm font-bold text-emerald-100">Item</span>
                </div>
                
                <div class="grid grid-cols-2 gap-4 pt-4 border-t border-white/10">
                    <div>
                        <p class="text-[10px] font-bold text-emerald-200 uppercase mb-1">Total Nilai</p>
                        <p id="statTotalNilai" class="text-sm font-bold">Rp 0</p>
                    </div>
                    <div>
                        <p class="text-[10px] font-bold text-emerald-200 uppercase mb-1">Kondisi Baik</p>
                        <p id="statKondisiBaik" class="text-sm font-bold">0 Item</p>
                    </div>
                </div>
            </div>
        </header>

        <!-- CONTROLS & SEARCH -->
        <div class="px-6 -mt-8 pb-4 relative z-20">
            <div class="bg-white rounded-[2rem] shadow-2xl p-2 flex flex-col gap-2 border border-slate-100">
                <!-- Search -->
                <div class="relative">
                    <i data-lucide="search" class="absolute left-4 top-1/2 -translate-y-1/2 w-5 h-5 text-slate-400"></i>
                    <input type="text" id="searchInput" placeholder="Cari nama barang..." 
                        class="w-full pl-12 pr-4 py-4 rounded-2xl bg-slate-50 border-none focus:ring-2 focus:ring-emerald-500 font-bold text-slate-700">
                </div>
                
                <!-- Filter Tabs -->
                <div class="flex gap-1 overflow-x-auto pb-1 no-scrollbar">
                    <button class="filter-tab active-tab whitespace-nowrap px-4 py-2 rounded-xl text-xs font-black bg-slate-100 text-slate-600 transition-all" data-filter="all">SEMUA</button>
                    <button class="filter-tab whitespace-nowrap px-4 py-2 rounded-xl text-xs font-black bg-slate-100 text-slate-600 transition-all" data-filter="Elektronik">ELEKTRONIK</button>
                    <button class="filter-tab whitespace-nowrap px-4 py-2 rounded-xl text-xs font-black bg-slate-100 text-slate-600 transition-all" data-filter="Furniture">MEBEL</button>
                    <button class="filter-tab whitespace-nowrap px-4 py-2 rounded-xl text-xs font-black bg-slate-100 text-slate-600 transition-all" data-filter="Perlengkapan">PERLENGKAPAN</button>
                </div>
            </div>
        </div>

        <!-- LIST CONTAINER -->
        <main class="flex-1 px-4 py-2 overflow-y-auto">
            <div id="inventoryContainer" class="flex flex-col gap-4">
                <!-- Cards will be injected here -->
                <div class="flex flex-col items-center justify-center py-20 text-slate-300">
                    <i data-lucide="loader-2" class="w-12 h-12 animate-spin mb-4"></i>
                    <p class="font-bold">Memuat Data...</p>
                </div>
            </div>
        </main>

        <!-- ADMIN FLOATING ACTION -->
        <div id="adminActions" class="fixed bottom-6 right-6 flex flex-col gap-3 hidden z-50">
            <button id="addBtn" class="w-14 h-14 bg-emerald-600 text-white rounded-full shadow-2xl flex items-center justify-center hover:scale-110 active:scale-95 transition-all">
                <i data-lucide="plus" class="w-6 h-6"></i>
            </button>
        </div>
    </div>

    <!-- MODAL AUTH -->
    <div id="authModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-[100] flex items-center justify-center p-6 hidden">
        <div class="bg-white rounded-[2.5rem] w-full max-w-sm p-8 shadow-2xl">
            <div class="text-center mb-6">
                <div class="w-16 h-16 bg-emerald-100 text-emerald-600 rounded-2xl flex items-center justify-center mx-auto mb-4">
                    <i data-lucide="shield-check" class="w-8 h-8"></i>
                </div>
                <h3 class="text-xl font-black text-slate-800">Mode Admin</h3>
                <p class="text-sm text-slate-500 font-medium">Masukkan password pengamanan</p>
            </div>
            <input type="password" id="adminPass" placeholder="••••••••" 
                class="w-full p-4 rounded-2xl bg-slate-100 border-none focus:ring-2 focus:ring-emerald-500 text-center text-lg font-black tracking-widest mb-4">
            <div class="flex gap-3">
                <button id="authClose" class="flex-1 py-4 rounded-2xl font-black text-slate-400 hover:bg-slate-50 transition-all">BATAL</button>
                <button id="authSubmit" class="flex-1 py-4 rounded-2xl bg-emerald-600 text-white font-black shadow-lg shadow-emerald-200 active:scale-95 transition-all">MASUK</button>
            </div>
        </div>
    </div>

    <!-- MODAL ITEM (ADD/EDIT) -->
    <div id="itemModal" class="fixed inset-0 bg-slate-900/80 backdrop-blur-md z-[100] flex items-end sm:items-center justify-center p-0 sm:p-6 hidden">
        <div class="bg-white rounded-t-[2.5rem] sm:rounded-[2.5rem] w-full max-w-md max-h-[90vh] overflow-hidden flex flex-col shadow-2xl">
            <div class="p-6 border-b border-slate-100 flex justify-between items-center bg-slate-50/50">
                <h3 id="modalTitle" class="text-lg font-black text-slate-800 uppercase tracking-tight">Tambah Barang</h3>
                <button onclick="document.getElementById('itemModal').classList.add('hidden')" class="p-2 text-slate-400 hover:text-slate-600 transition-all">
                    <i data-lucide="x" class="w-6 h-6"></i>
                </button>
            </div>
            <div class="flex-1 overflow-y-auto p-6 space-y-4">
                <input type="hidden" id="formMode" value="add">
                <input type="hidden" id="formNo" value="">
                <input type="hidden" id="formNoInv" value="">
                
                <div class="space-y-1">
                    <label class="text-[10px] font-black text-slate-400 uppercase ml-2">Nama Barang</label>
                    <input type="text" id="addNama" placeholder="Contoh: Bor Listrik" class="w-full p-4 rounded-2xl bg-slate-100 border-none font-bold">
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div class="space-y-1">
                        <label class="text-[10px] font-black text-slate-400 uppercase ml-2">Kategori</label>
                        <select id="addKategori" class="w-full p-4 rounded-2xl bg-slate-100 border-none font-bold">
                            <option value="Elektronik">Elektronik</option>
                            <option value="Furniture">Mebel</option>
                            <option value="Perlengkapan">Perlengkapan</option>
                            <option value="Kendaraan">Kendaraan</option>
                        </select>
                    </div>
                    <div class="space-y-1">
                        <label class="text-[10px] font-black text-slate-400 uppercase ml-2">Jumlah</label>
                        <input type="number" id="addJumlah" value="1" class="w-full p-4 rounded-2xl bg-slate-100 border-none font-bold">
                    </div>
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div class="space-y-1">
                        <label class="text-[10px] font-black text-slate-400 uppercase ml-2">Kondisi</label>
                        <select id="addKondisi" class="w-full p-4 rounded-2xl bg-slate-100 border-none font-bold">
                            <option value="Baik">Baik</option>
                            <option value="Rusak Ringan">Rusak Ringan</option>
                            <option value="Rusak Berat">Rusak Berat</option>
                        </select>
                    </div>
                    <div class="space-y-1">
                        <label class="text-[10px] font-black text-slate-400 uppercase ml-2">Lokasi</label>
                        <input type="text" id="addLokasi" placeholder="Gudang" class="w-full p-4 rounded-2xl bg-slate-100 border-none font-bold">
                    </div>
                </div>
                <div class="space-y-1">
                    <label class="text-[10px] font-black text-slate-400 uppercase ml-2">Harga Satuan (Opsional)</label>
                    <input type="number" id="addHarga" placeholder="0" class="w-full p-4 rounded-2xl bg-slate-100 border-none font-bold">
                </div>
                <div class="space-y-1">
                    <label class="text-[10px] font-black text-slate-400 uppercase ml-2">Keterangan</label>
                    <textarea id="addKeterangan" placeholder="..." class="w-full p-4 rounded-2xl bg-slate-100 border-none font-bold h-24"></textarea>
                </div>
            </div>
            <div class="p-6 bg-slate-50 border-t border-slate-100">
                <button id="submitBtn" class="w-full py-4 rounded-2xl bg-emerald-600 text-white font-black shadow-xl shadow-emerald-200 active:scale-95 transition-all">SIMPAN DATA</button>
            </div>
        </div>
    </div>

    <!-- SCRIPTS -->
    <script src="app.js"></script>
</body>
</html>
