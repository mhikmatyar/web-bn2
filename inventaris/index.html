<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>InvenBN2 - Sistem Inventaris Senior</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --navy: #0D1B2A;
            --accent: #1DA874;
            --danger: #E24B4A;
            --warning: #EF9F27;
            --text-main: #1F2937;
            --text-muted: #6B7280;
            --border-light: #EBEBEB;
        }
        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            background-color: #FFFFFF; 
            color: var(--text-main);
            line-height: 1.6;
            font-size: 14px;
            -webkit-tap-highlight-color: transparent;
        }
        
        /* SEARCH BAR CUSTOM */
        .search-container { position: sticky; top: 0; z-index: 40; background: white; padding-bottom: 8px; }
        .search-input-wrapper { 
            min-height: 44px; 
            border-radius: 12px; 
            background: #F3F4F6; 
            display: flex; 
            align-items: center; 
            padding: 0 16px; 
            gap: 12px; 
        }

        /* BOTTOM SHEETS */
        .sheet-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 100; opacity: 0; pointer-events: none; transition: opacity 0.3s; }
        .sheet-overlay.active { opacity: 1; pointer-events: auto; }
        
        .bottom-sheet {
            position: fixed; left: 0; right: 0; bottom: 0;
            background: white; border-radius: 24px 24px 0 0;
            z-index: 110; transform: translateY(100%);
            transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            max-height: 85vh; display: flex; flex-direction: column;
        }
        .bottom-sheet.active { transform: translateY(0); }
        .sheet-handle { width: 28px; height: 3px; background: #E5E7EB; border-radius: 100px; margin: 12px auto; }

        /* CHIPS */
        .filter-chip { 
            height: 40px;
            padding: 0 20px; 
            border: 0.5px solid #D1D5DB; 
            border-radius: 100px; 
            font-size: 13px; 
            font-weight: 500; 
            color: var(--text-muted); 
            transition: all 0.2s;
            display: flex; 
            align-items: center; 
            justify-content: center; 
            white-space: nowrap;
            line-height: 1;
        }
        .filter-chip.active { background: var(--accent); color: white; border-color: var(--accent); }

        /* PAGINATION */
        .pagination-btn { min-height: 44px; min-width: 44px; }
        
        /* SCROLLBAR */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="overflow-x-hidden">
    <div id="sheetOverlay" class="sheet-overlay"></div>

    <div class="flex h-screen overflow-hidden">
        <!-- SIDEBAR (DESKTOP) -->
        <aside id="sidebar" class="hidden md:flex fixed inset-y-0 left-0 z-50 bg-[#0D1B2A] text-slate-300 w-[220px] flex-col">
            <div class="p-6 flex items-center gap-3 border-b border-slate-800">
                <div class="w-10 h-10 bg-[#1DA874] rounded-xl flex items-center justify-center">
                    <i data-lucide="package" class="text-white w-6 h-6"></i>
                </div>
                <span class="font-extrabold text-white text-lg tracking-tight">InvenBN2</span>
            </div>
            <nav class="flex-1 p-4 space-y-2">
                <a href="#" class="flex items-center gap-3 px-4 py-3.5 rounded-xl bg-[#1DA874] text-white font-bold" data-page="dashboard">
                    <i data-lucide="layout-dashboard" class="w-5 h-5"></i> Dashboard
                </a>
                <a href="#" class="flex items-center gap-3 px-4 py-3.5 rounded-xl hover:bg-slate-800 font-bold" data-page="inventaris">
                    <i data-lucide="boxes" class="w-5 h-5"></i> Inventaris
                </a>
            </nav>
        </aside>

        <!-- MAIN CONTENT -->
        <main class="flex-1 flex flex-col w-full bg-white relative md:ml-[220px]">
            <!-- HEADER (MOBILE ONLY) -->
            <header class="md:hidden p-5 flex items-center justify-between border-b border-slate-100">
                <div class="flex items-center gap-3">
                    <div class="w-9 h-9 bg-[#1DA874] rounded-lg flex items-center justify-center">
                        <i data-lucide="package" class="text-white w-5 h-5"></i>
                    </div>
                    <span class="font-black text-slate-800 text-base">InvenBN2</span>
                </div>
            </header>

            <div class="flex-1 overflow-y-auto no-scrollbar pb-32">
                <!-- DASHBOARD STATS -->
                <section class="p-5 grid grid-cols-2 gap-4">
                    <div class="bg-white p-4 rounded-2xl border border-slate-100 shadow-sm">
                        <p class="text-[11px] font-medium text-slate-400 uppercase tracking-wide">Total Barang</p>
                        <h3 id="statTotal" class="text-[28px] font-black text-slate-800 leading-none mt-1">0</h3>
                    </div>
                    <div class="bg-white p-4 rounded-2xl border border-slate-100 shadow-sm">
                        <p class="text-[11px] font-medium text-slate-400 uppercase tracking-wide">Kategori</p>
                        <h3 id="statKat" class="text-[28px] font-black text-slate-800 leading-none mt-1">0</h3>
                    </div>
                    <div class="bg-white p-4 rounded-2xl border border-slate-100 shadow-sm">
                        <p class="text-[11px] font-medium text-slate-400 uppercase tracking-wide">Kondisi Baik</p>
                        <h3 id="statBaik" class="text-[28px] font-black text-[#1DA874] leading-none mt-1">0%</h3>
                    </div>
                    <div class="bg-white p-4 rounded-2xl border border-slate-100 shadow-sm">
                        <p class="text-[11px] font-medium text-slate-400 uppercase tracking-wide">Rusak</p>
                        <h3 id="statRusak" class="text-[28px] font-black text-[#E24B4A] leading-none mt-1">0%</h3>
                    </div>
                </section>

                <!-- SEARCH + FILTER AREA -->
                <section class="px-5 space-y-4">
                    <div class="search-input-wrapper border border-slate-100 shadow-sm">
                        <i data-lucide="search" class="w-5 h-5 text-slate-400"></i>
                        <input type="text" id="searchInput" placeholder="Cari nama atau nomor barang..." 
                            class="flex-1 bg-transparent border-none outline-none font-medium text-slate-700 h-11 placeholder:text-slate-400 text-sm">
                    </div>

                    <div class="flex items-center gap-2">
                        <button id="filterBtn" class="h-9 px-5 rounded-full border border-slate-200 font-bold text-[13px] text-slate-600 flex items-center gap-2 hover:bg-slate-50 transition-all">
                            Filter <i data-lucide="chevron-down" class="w-4 h-4 text-slate-400"></i>
                        </button>
                        <button id="sortBtn" class="h-9 px-5 rounded-full border border-slate-200 font-bold text-[13px] text-slate-600 flex items-center gap-2 hover:bg-slate-50 transition-all">
                            Urutkan <i data-lucide="chevron-down" class="w-4 h-4 text-slate-400"></i>
                        </button>
                    </div>

                    <!-- FILTER ACTIVE BAR -->
                    <div id="filterActiveBar" class="hidden h-9 px-4 bg-[#1DA874]/10 rounded-lg flex items-center justify-between">
                        <div class="flex items-center gap-2 overflow-hidden">
                            <span id="activeFilterText" class="text-[11px] font-bold text-[#1DA874] truncate">Aktif: Semua</span>
                        </div>
                        <button id="clearFiltersBtn" class="text-[11px] font-bold text-slate-400 shrink-0 touch-target px-2">Hapus semua</button>
                    </div>
                </section>

                <!-- LIST INVENTARIS -->
                <section class="p-5 space-y-4">
                    <h2 class="text-[11px] font-bold text-slate-400 uppercase tracking-widest px-1">Daftar inventaris</h2>
                    <div id="inventoryGrid" class="space-y-4">
                        <!-- Cards injected via JS -->
                    </div>

                    <!-- PAGINATION -->
                    <div id="paginationContainer" class="flex items-center justify-between gap-4 pt-6">
                        <!-- Buttons injected via JS -->
                    </div>
                </section>
            </div>

            <!-- BOTTOM MOBILE NAV -->
            <nav class="md:hidden fixed bottom-0 inset-x-0 bg-white border-t border-slate-100 flex items-center justify-around py-3 px-6 z-50">
                <button class="flex flex-col items-center gap-1 text-[#1DA874]" data-page="dashboard">
                    <i data-lucide="layout-dashboard" class="w-6 h-6"></i>
                    <span class="text-[10px] font-bold">Dashboard</span>
                </button>
                <button class="flex flex-col items-center gap-1 text-slate-400" data-page="inventaris">
                    <i data-lucide="boxes" class="w-6 h-6"></i>
                    <span class="text-[10px] font-bold">Inventaris</span>
                </button>
                <button id="mobileSettingsBtn" class="flex flex-col items-center gap-1 text-slate-400">
                    <i data-lucide="settings" class="w-6 h-6"></i>
                    <span class="text-[10px] font-bold">Pengaturan</span>
                </button>
            </nav>

            <!-- FAB (MOBILE) -->
            <button id="mobileAddBtn" class="md:hidden fixed bottom-24 right-6 w-14 h-14 bg-[#1DA874] text-white rounded-full shadow-lg shadow-[#1DA874]/30 flex items-center justify-center z-40 transition-transform active:scale-90">
                <i data-lucide="plus" class="w-7 h-7"></i>
            </button>
        </main>
    </div>

    <!-- BOTTOM SHEETS & MODALS -->
    
    <!-- FILTER -->
    <div id="filterSheet" class="bottom-sheet shadow-[0_-10px_40px_rgba(0,0,0,0.1)]">
        <div class="sheet-handle"></div>
        <div class="p-6 pt-2 flex-1 overflow-y-auto no-scrollbar">
            <h4 class="text-[16px] font-bold text-slate-800 mb-6">Filter</h4>
            <div class="space-y-8">
                <div>
                    <p class="text-[11px] font-bold text-slate-400 uppercase tracking-widest mb-4">Kategori</p>
                    <div class="flex flex-wrap gap-2.5" id="filterKategoriChips"></div>
                </div>
                <div>
                    <p class="text-[11px] font-bold text-slate-400 uppercase tracking-widest mb-4">Kondisi</p>
                    <div class="flex flex-wrap gap-2.5" id="filterKondisiChips"></div>
                </div>
                <div>
                    <p class="text-[11px] font-bold text-slate-400 uppercase tracking-widest mb-4">Lokasi</p>
                    <div class="flex flex-wrap gap-2.5" id="filterLokasiChips"></div>
                </div>
            </div>
        </div>
        <div class="p-6 flex gap-4 bg-white border-t border-slate-100">
            <button id="resetFilterBtn" class="flex-1 h-12 rounded-xl border border-slate-200 font-bold text-sm text-slate-600">Reset</button>
            <button id="applyFilterBtn" class="flex-1 h-12 rounded-xl bg-[#1DA874] text-white font-bold text-sm shadow-lg shadow-[#1DA874]/20">Terapkan</button>
        </div>
    </div>

    <!-- SORT -->
    <div id="sortSheet" class="bottom-sheet">
        <div class="sheet-handle"></div>
        <div class="p-6 pt-2">
            <h4 class="text-[14px] font-bold text-slate-800 mb-6">Urutkan</h4>
            <div class="space-y-1" id="sortOptions"></div>
        </div>
    </div>

    <!-- DETAIL -->
    <div id="detailSheet" class="bottom-sheet shadow-[0_-10px_40px_rgba(0,0,0,0.1)]">
        <div class="sheet-handle"></div>
        <div id="sheetContent" class="p-6 pt-2"></div>
    </div>

    <!-- ITEM FORM (ADD/EDIT) -->
    <div id="itemModal" class="fixed inset-0 z-[150] flex items-center justify-center p-4 hidden">
        <div class="bg-white w-full max-w-sm rounded-[28px] shadow-2xl overflow-hidden">
            <div class="p-6 bg-slate-50 border-b border-slate-100 flex justify-between items-center">
                <h3 id="formTitle" class="text-lg font-black text-slate-800">Tambah Barang</h3>
                <button onclick="hideItemForm()" class="w-10 h-10 bg-white rounded-full flex items-center justify-center shadow-sm text-slate-400"><i data-lucide="x" class="w-5 h-5"></i></button>
            </div>
            <form id="itemForm" class="p-5 space-y-3.5 max-h-[75vh] overflow-y-auto no-scrollbar">
                <input type="hidden" id="formId">
                <div class="space-y-1">
                    <label class="text-[10px] font-bold text-slate-400 uppercase tracking-widest px-1">Nomor Inventaris</label>
                    <input type="text" id="inputNoInventaris" placeholder="Contoh: INVBN2/PRL/26/008" class="w-full h-11 px-4 bg-slate-50 border border-slate-100 rounded-xl focus:border-[#1DA874] outline-none text-sm font-bold">
                </div>
                <div class="space-y-1">
                    <label class="text-[10px] font-bold text-slate-400 uppercase tracking-widest px-1">Nama Barang</label>
                    <input type="text" id="inputNama" required class="w-full h-11 px-4 bg-slate-50 border border-slate-100 rounded-xl focus:border-[#1DA874] outline-none text-sm font-medium">
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div class="space-y-1">
                        <label class="text-[10px] font-bold text-slate-400 uppercase tracking-widest px-1">Kategori</label>
                        <select id="inputKategori" required class="w-full h-11 px-4 bg-slate-50 border border-slate-100 rounded-xl focus:border-[#1DA874] outline-none text-sm">
                            <option value="Perlengkapan">Perlengkapan</option>
                            <option value="Peralatan">Peralatan</option>
                            <option value="Elektronik">Elektronik</option>
                            <option value="Aset">Aset</option>
                        </select>
                    </div>
                    <div class="space-y-1">
                        <label class="text-[10px] font-bold text-slate-400 uppercase tracking-widest px-1">Jumlah</label>
                        <input type="number" id="inputJumlah" required class="w-full h-11 px-4 bg-slate-50 border border-slate-100 rounded-xl focus:border-[#1DA874] outline-none text-sm">
                    </div>
                </div>
                <div class="space-y-1">
                    <label class="text-[10px] font-bold text-slate-400 uppercase tracking-widest px-1">Kondisi</label>
                    <select id="inputKondisi" required class="w-full h-11 px-4 bg-slate-50 border border-slate-100 rounded-xl focus:border-[#1DA874] outline-none text-sm">
                        <option value="Baik">Baik</option>
                        <option value="Rusak Ringan">Rusak Ringan</option>
                        <option value="Rusak">Rusak</option>
                    </select>
                </div>
                <div class="space-y-1">
                    <label class="text-[10px] font-bold text-slate-400 uppercase tracking-widest px-1">Lokasi</label>
                    <input type="text" id="inputLokasi" required class="w-full h-11 px-4 bg-slate-50 border border-slate-100 rounded-xl focus:border-[#1DA874] outline-none text-sm">
                </div>
                <div class="space-y-1">
                    <label class="text-[10px] font-bold text-slate-400 uppercase tracking-widest px-1">Keterangan</label>
                    <textarea id="inputKeterangan" class="w-full p-4 bg-slate-50 border border-slate-100 rounded-xl focus:border-[#1DA874] outline-none min-h-[80px] text-sm"></textarea>
                </div>
                <button type="submit" class="w-full h-12 bg-[#1DA874] text-white rounded-2xl font-black uppercase tracking-widest shadow-lg shadow-[#1DA874]/20 text-xs">Simpan Barang</button>
            </form>
        </div>
    </div>

    <!-- ADMIN LOGIN -->
    <div id="authModal" class="fixed inset-0 bg-[#0D1B2A] z-[200] flex flex-col items-center justify-center p-8 hidden">
        <div class="w-full max-w-xs text-center space-y-10">
            <div class="space-y-4">
                <div class="w-20 h-20 bg-[#1DA874]/20 text-[#1DA874] rounded-[2rem] flex items-center justify-center mx-auto"><i data-lucide="shield-check" class="w-10 h-10"></i></div>
                <h2 class="text-white text-2xl font-black uppercase tracking-tight">Login Admin</h2>
                <p class="text-slate-400 font-bold">Masukkan PIN Keamanan</p>
            </div>
            <div class="flex justify-center gap-4 py-4" id="pinDots">
                <div class="w-5 h-5 rounded-full border-2 border-slate-700"></div>
                <div class="w-5 h-5 rounded-full border-2 border-slate-700"></div>
                <div class="w-5 h-5 rounded-full border-2 border-slate-700"></div>
                <div class="w-5 h-5 rounded-full border-2 border-slate-700"></div>
            </div>
            <div class="grid grid-cols-3 gap-4 w-full" id="numpad"></div>
            <button onclick="hideAuth()" class="text-slate-500 font-bold uppercase tracking-widest text-[10px] py-4">Batal</button>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
