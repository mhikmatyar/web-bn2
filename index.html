<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Bumi Neikarta 2</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="portal-container">
        <div class="portal-header">
            <div class="logo-icon">
                <i class="fas fa-home"></i>
            </div>
            <h1>Portal Bumi Neikarta 2</h1>
            <p>Pilih layanan yang ingin Anda akses</p>
        </div>

        <div class="app-grid">
            <a href="/jimpitan/" class="app-card jimpitan-card">
                <div class="app-icon">
                    <i class="fas fa-wallet"></i>
                </div>
                <div class="app-info">
                    <h2>Jimpitan Harian</h2>
                    <p>Rekap harian kas jimpitan dan pengeluaran warga</p>
                </div>
                <div class="app-arrow">
                    <i class="fas fa-arrow-right"></i>
                </div>
            </a>

            <a href="/inventaris/" class="app-card inventaris-card">
                <div class="app-icon">
                    <i class="fas fa-boxes"></i>
                </div>
                <div class="app-info">
                    <h2>Katalog Inventaris</h2>
                    <p>Data aset, perlengkapan, dan barang inventaris</p>
                </div>
                <div class="app-arrow">
                    <i class="fas fa-arrow-right"></i>
                </div>
            </a>
        </div>
        
        <div class="portal-footer">
            <p>&copy; 2026 Warga Bumi Neikarta 2</p>
        </div>
    </div>
</body>
</html>
