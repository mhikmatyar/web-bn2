<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jimpitan BN2 - Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <!-- HEADER -->
        <header class="app-header">
            <h1>Jimpitan BN2</h1>
            <p id="chartMonthLabel">Bulan Ini</p>
        </header>

        <main id="main-content">
            <!-- VIEW: HOME -->
            <div id="view-jimpitan" class="tab-content active">
                <!-- HERO CARD -->
                <div class="glass-card hero-card">
                    <div class="label">Total Saldo Kas</div>
                    <div class="amount" id="saldoTotalMonth">Rp 0</div>
                </div>

                <!-- STATS GRID -->
                <div class="stats-grid">
                    <div class="glass-card stat-box">
                        <span class="label">Pemasukan</span>
                        <span class="val green" id="jimpitanMonth">Rp 0</span>
                    </div>
                    <div class="glass-card stat-box">
                        <span class="label">Pengeluaran</span>
                        <span class="val red" id="pengeluaranMonth">Rp 0</span>
                    </div>
                </div>

                <!-- CHART CARD -->
                <div class="glass-card">
                    <div style="display: flex; justify-content: space-between; align-items: center;">
                        <h3 style="font-size: 16px; font-weight: 800;">Grafik Jimpitan</h3>
                        <select id="weekFilter" style="border: none; background: transparent; font-size: 12px; font-weight: 700; color: var(--primary);">
                            <option value="all">Satu Bulan</option>
                            <option value="1">Minggu 1</option>
                            <option value="2">Minggu 2</option>
                        </select>
                    </div>
                    <div class="chart-container">
                        <canvas id="jimpitanChart"></canvas>
                    </div>
                </div>

                <!-- TRANSACTIONS -->
                <div class="section-title">
                    <h3>Daftar Transaksi</h3>
                    <span class="btn-link" data-tab="jimpitan-list">Lihat Semua</span>
                </div>
                <div class="transaction-list" id="recentList">
                    <!-- Dynamic -->
                </div>
            </div>

            <!-- VIEW: HISTORY -->
            <div id="view-jimpitan-list" class="tab-content">
                <div class="section-title">
                    <h3 id="historyTitle">Semua Transaksi</h3>
                    <div style="display: flex; gap: 8px;">
                        <select id="monthSelect" style="border: none; background: var(--bg-glass); padding: 4px 8px; border-radius: 8px; font-size: 12px;"></select>
                        <select id="yearSelect" style="border: none; background: var(--bg-glass); padding: 4px 8px; border-radius: 8px; font-size: 12px;"></select>
                    </div>
                </div>
                <div class="transaction-list" id="jimpitanTbody">
                    <!-- Populated by JS -->
                </div>
            </div>

            <!-- VIEW: SETTINGS -->
            <div id="view-settings" class="tab-content">
                <div class="section-title">
                    <h3>Pengaturan Data</h3>
                </div>
                <div class="glass-card settings-list">
                    <div class="input-group">
                        <label style="font-size: 12px; font-weight: 700;">Google Sheet CSV URL</label>
                        <input type="text" id="sheetUrl" placeholder="https://docs.google.com/...">
                    </div>
                    <button class="btn-primary" id="connectBtn">Simpan Konfigurasi</button>
                    <div id="connectionStatus" style="font-size: 12px; text-align: center; margin-top: 8px;"></div>
                    <hr style="border: none; border-top: 1px solid var(--border-glass); margin: 12px 0;">
                    <button id="disconnectBtn" style="background: transparent; border: none; color: var(--danger); font-size: 14px; font-weight: 700; cursor: pointer;">Putuskan Koneksi</button>
                </div>
            </div>
        </main>

        <!-- BOTTOM NAV -->
        <nav class="bottom-nav">
            <div class="nav-item active" data-tab="jimpitan">
                <i class="fas fa-home"></i>
                <span>Home</span>
            </div>
            <div class="nav-item" data-tab="jimpitan-list">
                <i class="fas fa-history"></i>
                <span>Riwayat</span>
            </div>
            <div class="nav-item" data-tab="settings-auth">
                <i class="fas fa-cog"></i>
                <span>Admin</span>
            </div>
        </nav>
    </div>

    <!-- AUTH MODAL -->
    <div id="authModal" class="modal hidden">
        <div class="modal-content">
            <h3 style="margin-bottom: 12px;">Akses Admin</h3>
            <p style="font-size: 14px; color: var(--text-muted); margin-bottom: 20px;">Masukkan password untuk mengelola data.</p>
            <input type="password" id="adminPass" placeholder="Password..." style="width: 100%; padding: 14px; border-radius: 12px; border: 1px solid #eee; margin-bottom: 20px; text-align: center;">
            <div style="display: flex; gap: 12px;">
                <button id="closeAuthBtn" style="flex: 1; padding: 14px; border: none; border-radius: 12px; background: #eee; font-weight: 700;">Batal</button>
                <button id="confirmAuthBtn" style="flex: 1; padding: 14px; border: none; border-radius: 12px; background: var(--primary); color: white; font-weight: 700;">Masuk</button>
            </div>
        </div>
    </div>

    <!-- DETAIL MODAL -->
    <div id="detailModal" class="modal hidden">
        <div class="modal-content">
            <div style="text-align: center; margin-bottom: 24px;">
                <div id="detailIcon" style="width: 60px; height: 60px; border-radius: 20px; background: #f0fdf4; color: var(--success); display: flex; align-items: center; justify-content: center; margin: 0 auto 12px; font-size: 24px;">
                    <i class="fas fa-receipt"></i>
                </div>
                <h3 id="detailTipe">Transaksi</h3>
            </div>
            <div style="display: flex; flex-direction: column; gap: 12px; font-size: 14px;">
                <div style="display: flex; justify-content: space-between;"><span style="color: var(--text-muted);">Tanggal</span><span id="detailTanggal">-</span></div>
                <div style="display: flex; justify-content: space-between;"><span style="color: var(--text-muted);">Pelapor</span><span id="detailPelapor">-</span></div>
                <div style="display: flex; justify-content: space-between;"><span style="color: var(--text-muted);">Keterangan</span><span id="detailKeterangan">-</span></div>
            </div>
            <div style="margin-top: 24px; padding: 20px; background: #f8fafc; border-radius: 16px; text-align: center;">
                <div style="font-size: 12px; font-weight: 700; color: var(--text-muted); margin-bottom: 4px;">NOMINAL</div>
                <h2 id="detailNominal" style="font-size: 28px; font-weight: 800;">Rp 0</h2>
            </div>
            <button id="closeDetailBtn" style="width: 100%; margin-top: 24px; padding: 14px; border-radius: 12px; border: none; background: var(--primary); color: white; font-weight: 700;">Tutup</button>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
